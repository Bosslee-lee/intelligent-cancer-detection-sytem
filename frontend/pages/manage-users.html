<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - ICDS</title>

    <!-- Fonts & Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Global + reuse hospital styles -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/hospital-profile.css" />
  </head>

  <body>
    <div class="app-container">
      <!-- SIDEBAR -->
      <div id="sidebar-container"></div>

      <!-- MAIN CONTENT -->
      <div class="main-content" id="mainContent">
        <!-- HEADER -->
        <div id="header-container"></div>

        <!-- PAGE CONTENT -->
        <div class="profile-content">

          <!-- PAGE HEADER -->
          <div class="profile-header">
            <div>
              <h1>Manage Users</h1>
              <p>Manage hospital staff and system users</p>
            </div>

            <button id="addUserBtn" class="btn-primary">
              <i class="fas fa-user-plus"></i> Add User
            </button>
          </div>

          <!-- STATS -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon">
                <i class="fas fa-users"></i>
              </div>
              <div class="stat-info">
                <h3 id="totalUsers">0</h3>
                <p>Total Staff</p>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">
                <i class="fas fa-user-md"></i>
              </div>
              <div class="stat-info">
                <h3 id="totalDoctors">0</h3>
                <p>Doctors</p>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">
                <i class="fas fa-user-nurse"></i>
              </div>
              <div class="stat-info">
                <h3 id="totalNurses">0</h3>
                <p>Nurses</p>
              </div>
            </div>
          </div>

          <!-- USERS LIST -->
          <div class="profile-card">
            <div class="section-header">
              <h3><i class="fas fa-users"></i> Staff Members</h3>
            </div>

            <div id="usersList" class="items-list">
              <div class="empty-state">
                <i class="fas fa-user-plus"></i>
                <p>Loading users...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================= -->
    <!-- ADD USER MODAL -->
    <!-- ========================= -->
    <div id="addUserModal" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3><i class="fas fa-user-plus"></i> Add New User</h3>
          <span class="close-modal">&times;</span>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="userName" placeholder="Enter full name" />
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="userEmail" placeholder="Enter email" />
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="userPhone" placeholder="+254..." />
          </div>

          <div class="form-group">
            <label>Role *</label>
            <select id="userRole">
              <option value="">Select role</option>
              <option value="doctor">Doctor</option>
              <option value="nurse">Nurse</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="form-group">
            <label>Department</label>
            <input type="text" id="userDepartment" placeholder="Optional" />
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="cancelUserBtn">Cancel</button>
          <button class="btn-primary" id="saveUserBtn">Save User</button>
        </div>
      </div>
    </div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->
    <script src="../utils/env.js"></script>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/header.js"></script>

    <script type="module">
      import { loadLayout } from "../js/loader.js";
      import "../js/manage-users.js";

      await loadLayout();

      // 🔥 trigger page logic AFTER sidebar + header load
      window.dispatchEvent(new Event("layoutLoaded"));
    </script>

    <script>
      // Logout helper
      function handleLogout() {
        localStorage.clear();
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
